<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGL MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
main{max-width:760px;margin:55px auto;padding:24px}
h1{letter-spacing:7px;font-size:32px}
.sub{color:#777;letter-spacing:3px;font-size:11px}
input{background:#111;color:white;border:1px solid #333;padding:14px;border-radius:8px;width:100%;margin:8px 0}
button{background:#f5f5f5;color:#080808;border:0;border-radius:25px;padding:11px 15px;cursor:pointer;font-weight:bold;margin:4px}
button.secondary{background:#191919;color:white;border:1px solid #333}
button.star{background:#191919;color:white;border:1px solid #333;min-width:42px}
button:hover{opacity:.8}
.panel{border:1px solid #292929;border-radius:14px;padding:20px;margin-top:22px}
#status{color:#aaa;font-size:13px;line-height:1.6}
.track{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #222;padding:12px 0}
.track-info{min-width:0;flex:1}
.track strong{display:block;overflow-wrap:anywhere}
.track small{display:block;color:#888;margin-top:4px}
.track-actions{display:flex;align-items:center;flex-shrink:0}
#now{font-size:18px;margin:20px 0 6px}
.empty{color:#666;font-size:14px;padding:12px 0}
@media(max-width:500px){
 main{margin:20px auto;padding:16px}
 h1{font-size:25px}
 .track{align-items:flex-start}
 .track-actions{flex-direction:column}
 .panel{padding:15px}
}
</style>
</head>
<body>
<main>
  <div class="sub">PERSONAL MUSIC PLAYER</div>
  <h1>BGL MUSIC</h1>
  <p style="color:#888">Your music. Your space.</p>

  <section class="panel">
    <p id="status">Подключи свой аккаунт Spotify.</p>
    <button id="login">CONNECT SPOTIFY</button>
    <button id="logout" class="secondary" hidden>LOG OUT</button>
  </section>

  <section class="panel">
    <h3>Поиск музыки</h3>
    <input id="query" placeholder="Название песни или исполнитель">
    <button id="search">SEARCH</button>
    <div id="results"></div>
  </section>

  <section class="panel">
    <h3>⭐ Избранное</h3>
    <p style="color:#777;font-size:13px">Твои сохранённые треки</p>
    <div id="favorites"></div>
  </section>

  <section class="panel">
    <div class="sub">NOW PLAYING</div>
    <div id="now">Ничего не играет</div>
    <div id="artist" style="color:#888"></div>
    <div style="margin-top:18px">
      <button id="prev" class="secondary">|◀</button>
      <button id="toggle">▶ PLAY</button>
      <button id="next" class="secondary">▶|</button>
      <button id="currentFavorite" class="star" title="Добавить в избранное" disabled>☆</button>
    </div>
    <p id="device" style="color:#666;font-size:12px"></p>
  </section>
</main>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const CLIENT_ID = "b7f898cd7fdb41b696a8d9a92629b21c";
const REDIRECT_URI = "https://grooxyg.github.io/BGLMUSICK/";
const SCOPES = [
  "streaming",
  "user-read-email",
  "user-read-private",
  "user-read-playback-state",
  "user-modify-playback-state"
].join(" ");

let player = null;
let deviceId = null;
let accessToken = localStorage.getItem("bgl_access_token");
let expiresAt = Number(localStorage.getItem("bgl_expires_at") || 0);
let refreshToken = localStorage.getItem("bgl_refresh_token");
let initializing = false;
let currentTrack = null;

const statusEl = document.getElementById("status");
function status(message) {
  statusEl.textContent = message;
}

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem("bgl_favorites") || "[]");
  } catch {
    return [];
  }
}

function isFavorite(uri) {
  return getFavorites().some(track => track.uri === uri);
}

function saveFavorites(list) {
  localStorage.setItem("bgl_favorites", JSON.stringify(list));
  renderFavorites();
  renderResults();
  updateCurrentFavorite();
}

function toggleFavorite(track) {
  if (!track || !track.uri) return;

  const list = getFavorites();
  const exists = list.some(item => item.uri === track.uri);

  if (exists) {
    saveFavorites(list.filter(item => item.uri !== track.uri));
  } else {
    saveFavorites([{
      uri: track.uri,
      name: track.name,
      artists: track.artists
    }, ...list]);
  }
}

function makeTrackRow(track, allowRemove = false) {
  const row = document.createElement("div");
  row.className = "track";

  const info = document.createElement("div");
  info.className = "track-info";

  const title = document.createElement("strong");
  title.textContent = track.name;

  const artist = document.createElement("small");
  artist.textContent = Array.isArray(track.artists)
    ? track.artists.map(a => typeof a === "string" ? a : a.name).join(", ")
    : "";

  info.append(title, artist);

  const actions = document.createElement("div");
  actions.className = "track-actions";

  const play = document.createElement("button");
  play.textContent = "▶";
  play.title = "Воспроизвести";
  play.addEventListener("click", () => playTrack(track.uri));

  const star = document.createElement("button");
  star.className = "star";
  star.textContent = allowRemove ? "✕" : (isFavorite(track.uri) ? "★" : "☆");
  star.title = allowRemove ? "Убрать из избранного" : "Добавить или убрать из избранного";
  star.addEventListener("click", () => toggleFavorite(track));

  actions.append(play, star);
  row.append(info, actions);
  return row;
}

function renderFavorites() {
  const container = document.getElementById("favorites");
  container.replaceChildren();

  const list = getFavorites();

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Пока здесь пусто. Добавь песни кнопкой ☆ в поиске.";
    container.append(empty);
    return;
  }

  list.forEach(track => {
    container.append(makeTrackRow(track, true));
  });
}

function renderResults() {
  const container = document.getElementById("results");
  container.querySelectorAll(".track").forEach(row => {
    const button = row.querySelector(".star");
    if (button) {
      const title = row.querySelector("strong")?.textContent;
      const artist = row.querySelector("small")?.textContent;
      const track = getLastSearchTracks().find(t =>
        t.name === title &&
        t.artists.map(a => a.name).join(", ") === artist
      );
      if (track) button.textContent = isFavorite(track.uri) ? "★" : "☆";
    }
  });
}

let lastSearchTracks = [];
function getLastSearchTracks() {
  return lastSearchTracks;
}

function randomString(length) {
  const bytes = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
}

async function challengeFor(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function login() {
  const verifier = randomString(32);
  const challenge = await challengeFor(verifier);
  const state = randomString(16);

  localStorage.setItem("bgl_verifier", verifier);
  localStorage.setItem("bgl_state", state);

  const params = new URLSearchParams({
    response_type: "code",
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state
  });

  location.href = "https://accounts.spotify.com/authorize?" + params;
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem("bgl_verifier");
  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: "authorization_code",
      code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    })
  });

  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error_description || data.error || "Не удалось войти");
  }
  saveTokens(data);
}

function saveTokens(data) {
  accessToken = data.access_token;
  expiresAt = Date.now() + data.expires_in * 1000;
  localStorage.setItem("bgl_access_token", accessToken);
  localStorage.setItem("bgl_expires_at", String(expiresAt));

  if (data.refresh_token) {
    refreshToken = data.refresh_token;
    localStorage.setItem("bgl_refresh_token", refreshToken);
  }
}

async function getToken() {
  if (accessToken && Date.now() < expiresAt - 60000) return accessToken;
  if (!refreshToken) {
    throw new Error("Сессия закончилась. Нажми CONNECT SPOTIFY.");
  }

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: "refresh_token",
      refresh_token: refreshToken
    })
  });

  const data = await response.json();
  if (!response.ok) {
    throw new Error("Не удалось обновить вход. Подключи Spotify заново.");
  }

  saveTokens(data);
  return accessToken;
}

async function api(url, options = {}) {
  const token = await getToken();
  const response = await fetch(url, {
    ...options,
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    throw new Error(data.error?.message || "Spotify API: " + response.status);
  }

  if (response.status === 204) return null;
  return response.json();
}

function updateCurrentFavorite() {
  const button = document.getElementById("currentFavorite");
  button.disabled = !currentTrack;
  button.textContent = currentTrack && isFavorite(currentTrack.uri) ? "★" : "☆";
  button.title = currentTrack
    ? "Добавить или убрать из избранного"
    : "Сначала включи песню";
}

function initPlayer() {
  if (!accessToken || !window.Spotify || initializing || player) return;
  initializing = true;

  player = new Spotify.Player({
    name: "BGL MUSIC",
    volume: 0.7,
    getOAuthToken: async callback => {
      try {
        callback(await getToken());
      } catch (error) {
        status(error.message);
      }
    }
  });

  player.addListener("ready", ({device_id}) => {
    deviceId = device_id;
    document.getElementById("device").textContent = "Плеер готов к воспроизведению";
    status("Spotify подключён.");
  });

  player.addListener("not_ready", () => {
    deviceId = null;
    document.getElementById("device").textContent = "Плеер отключён";
  });

  player.addListener("player_state_changed", state => {
    if (!state) return;

    const track = state.track_window.current_track;
    currentTrack = {
      uri: track.uri,
      name: track.name,
      artists: track.artists.map(a => a.name)
    };

    document.getElementById("now").textContent = track.name;
    document.getElementById("artist").textContent =
      track.artists.map(a => a.name).join(", ");
    document.getElementById("toggle").textContent =
      state.paused ? "▶ PLAY" : "Ⅱ PAUSE";

    updateCurrentFavorite();
  });

  player.addListener("initialization_error", e => status("Ошибка плеера: " + e.message));
  player.addListener("authentication_error", e => status("Ошибка входа: " + e.message));
  player.addListener("account_error", e => status("Проверь Premium: " + e.message));
  player.addListener("playback_error", e => status("Ошибка воспроизведения: " + e.message));

  player.connect().then(ok => {
    if (!ok) status("Не удалось подключить плеер. Обнови страницу.");
    else status("Подключаем плеер Spotify…");
  });
}

async function handleCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");

  if (error) {
    status("Spotify отменил вход: " + error);
    history.replaceState({}, "", REDIRECT_URI);
    return;
  }

  if (!code) return;

  if (!state || state !== localStorage.getItem("bgl_state")) {
    status("Проверка входа не пройдена. Попробуй подключиться заново.");
    history.replaceState({}, "", REDIRECT_URI);
    return;
  }

  try {
    await exchangeCode(code);
    localStorage.removeItem("bgl_verifier");
    localStorage.removeItem("bgl_state");
    history.replaceState({}, "", REDIRECT_URI);
    status("Вход выполнен. Подключаем плеер…");
    initPlayer();
  } catch (e) {
    status(e.message);
  }
}

async function searchTracks() {
  const query = document.getElementById("query").value.trim();
  if (!query) return;

  const results = document.getElementById("results");
  results.textContent = "Ищем…";

  try {
    const data = await api(
      "https://api.spotify.com/v1/search?type=track&limit=8&q=" +
      encodeURIComponent(query)
    );

    lastSearchTracks = data.tracks.items;
    results.replaceChildren();

    lastSearchTracks.forEach(track => {
      results.append(makeTrackRow({
        uri: track.uri,
        name: track.name,
        artists: track.artists
      }));
    });

    if (!lastSearchTracks.length) {
      results.textContent = "Ничего не найдено.";
    }
  } catch (e) {
    results.textContent = e.message;
  }
}

async function playTrack(uri) {
  try {
    if (!player || !deviceId) {
      status("Подожди, пока плеер подключится.");
      return;
    }

    await player.activateElement();

    await api(
      "https://api.spotify.com/v1/me/player/play?device_id=" +
      encodeURIComponent(deviceId),
      {method:"PUT", body:JSON.stringify({uris:[uri]})}
    );

    status("Запускаем трек…");
  } catch (e) {
    status(e.message);
  }
}

document.getElementById("login").addEventListener("click", login);
document.getElementById("search").addEventListener("click", searchTracks);
document.getElementById("query").addEventListener("keydown", e => {
  if (e.key === "Enter") searchTracks();
});

document.getElementById("currentFavorite").addEventListener("click", () => {
  if (currentTrack) toggleFavorite(currentTrack);
});

document.getElementById("toggle").addEventListener("click", async () => {
  try {
    if (!player) return status("Сначала подключи Spotify.");
    await player.activateElement();
    await player.togglePlay();
  } catch (e) {
    status(e.message);
  }
});

document.getElementById("prev").addEventListener("click", async () => {
  try {
    await player?.previousTrack();
  } catch (e) {
    status(e.message);
  }
});

document.getElementById("next").addEventListener("click", async () => {
  try {
    await player?.nextTrack();
  } catch (e) {
    status(e.message);
  }
});

document.getElementById("logout").addEventListener("click", () => {
  ["bgl_access_token","bgl_expires_at","bgl_refresh_token",
   "bgl_verifier","bgl_state"].forEach(k => localStorage.removeItem(k));
  location.href = REDIRECT_URI;
});

async function start() {
  renderFavorites();
  await handleCallback();

  if (accessToken) {
    document.getElementById("login").hidden = true;
    document.getElementById("logout").hidden = false;
    initPlayer();
  }
}

window.onSpotifyWebPlaybackSDKReady = initPlayer;
start();
</script>
</body>
</html>
