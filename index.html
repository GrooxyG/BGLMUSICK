<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGL MUSIC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    .player {
      width: min(360px, 90%);
      padding: 30px;
      border: 1px solid #333;
      border-radius: 18px;
      text-align: center;
    }
    h1 { letter-spacing: 5px; }
    p { color: #999; }
    button {
      background: white;
      color: black;
      border: 0;
      border-radius: 30px;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="player">
    <h1>BGL MUSIC</h1>
    <p>YOUR MUSIC. YOUR SPACE.</p>
    <button onclick="alert('Скоро подключим Spotify!')">
      ▶ PLAY
    </button>
  </main>
</body>
</html>
